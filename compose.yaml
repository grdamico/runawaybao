services:
  openbao:
    image: openbao/openbao:2.7.1
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_TOKEN:?Copy .env.example to .env and set BAO_TOKEN}
    command:
      - server
      - -dev
      - -dev-listen-address=0.0.0.0:8200
    ports:
      - "127.0.0.1:${BAO_PORT:-8200}:8200"
    restart: unless-stopped

  tetragon:
    image: quay.io/cilium/tetragon:v1.7.0
    privileged: true
    pid: host
    cgroup: host
    volumes:
      - /sys/kernel:/sys/kernel:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /var/run:/var/run
    restart: unless-stopped
